apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-ca-cert
  namespace: openshift-config
data:
  ca.crt: |
    <REPLACE_WITH_YOUR_LDAP_CA_CERTIFICATE_CHAIN>
    Paste the CA certificate chain needed to verify your LDAP server's
    TLS certificate. This is used by OAuth and other components that
    connect to the LDAP identity provider.
