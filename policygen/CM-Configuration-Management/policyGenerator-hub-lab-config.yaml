---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: policy-hub-lab-config
placementBindingDefaults:
  name: binding-hub-lab-config
policyDefaults:
  categories:
    - CM Configuration Management
  controls:
    - CM-6 Configuration Settings
  namespace: policies
  policySets:
    - policyset-hub-lab
  remediationAction: enforce
  severity: medium
  standards:
    - NIST SP 800-53
policies:

# ACM Policies - Start
  - name: policy-hub-lab-acm-config
    manifests:
      - path: ACM/policy-lab-bmh-crd.yaml #creates and patches the BareMetalHost CRD
      - path: ACM/policy-agent-service-config.yaml
        patches:
          - spec:
              databaseStorage:
                storageClassName: lvms-vg1-lvms
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
              filesystemStorage:
                storageClassName: lvms-vg1-lvms
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
              imageStorage:
                storageClassName: lvms-vg1-lvms
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
              osImages:
                - openshiftVersion: "4.21"
                  url: "https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.21/4.21.0/rhcos-4.21.0-x86_64-live-iso.x86_64.iso"
                  cpuArchitecture: "x86_64"
                  version: "9.6.20251212-1"
# ACM Policies - End

# ACS Central - Start
# ACS Central - End

# Console Policies - Start
  - name: policy-hub-lab-console
    manifests:
      - path: Console/policy-console-link-gitops-ztp.yaml
# Console Policies - End

# Logging (hub forwarder) - Start
# Logging (hub forwarder) - End

# Lab LVMS (dynamic PVCs on second disk; retires LSO on same disk) - Start
  - name: policy-hub-lab-lvms
    manifests:
      - path: Storage/LVMS/base/lvm-storage-operator-namespace.yaml
      - path: Storage/LVMS/base/lvm-storage-operator-operator-group.yaml
      - path: Storage/LVMS/base/lvm-storage-operator-subscription.yaml
        patches:
          - spec:
              channel: stable-4.21
      - path: Storage/LVMS/configs/policy-lvms-lvmcluster-hub-lab.yaml
      - path: Storage/LVMS/configs/policy-lvms-storageclass-hub-lab.yaml
      - path: Storage/LVMS/configs/policy-lvms-lvmcluster-status-hub-lab.yaml
# Lab LVMS - End

# Lab Minimise - Start
  - name: policy-hub-lab-minimise-monitoring
    manifests:
      - path: Lab-Minimise/policy-minimise-monitoring.yaml
      - path: Lab-Minimise/policy-disable-user-workload-monitoring.yaml
#   - name: policy-hub-lab-minimise-catalogs
#     manifests:
#       - path: Lab-Minimise/policy-disable-catalog-sources.yaml
#         complianceType: mustnothave
#   - name: policy-hub-lab-minimise-acm
#     manifests:
#       - path: Lab-Minimise/policy-minimise-acm.yaml
#       - path: Lab-Minimise/policy-minimise-mce-replicas.yaml
# # Lab Minimise - End

policySets:
  - name: policyset-hub-lab 
    description: Configuration policies for the hub cluster.
    placement:
      placementName: placement-hub-lab-clusters
