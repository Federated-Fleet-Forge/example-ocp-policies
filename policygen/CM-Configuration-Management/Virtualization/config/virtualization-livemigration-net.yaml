  config: '{
    "cniVersion": "0.3.1",
    "name": "livemigration-network",
    "type": "macvlan",
    "master": "bond0.3113",
    "mode": "bridge",
    "ipam": {
      "type": "whereabouts",
      "range": "10.0.0.1/20",
      "exclude": [
        "10.0.0.1/21",
        "10.0.0.1/24",
        "10.0.0.1/24",
        "10.0.0.1/24",
        "10.0.0.1/24",
        "10.0.0.1/24",
        "10.0.0.1/24",
        "10.0.0.1/24"
      ]
    }
  }'
