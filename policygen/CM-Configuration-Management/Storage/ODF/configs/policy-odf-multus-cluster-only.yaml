apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: ocs-cluster
  namespace: openshift-storage
spec:
  config: '{
  	"cniVersion": "0.3.1",
  	"type": "macvlan",
  	"master": "{{ fromConfigMap "openshift-config" "cluster-info" "odf_storage_interface" }}",
  	"mode": "bridge",
  	"ipam": {
    	    "type": "whereabouts",
    	    "range": "{{ fromConfigMap "openshift-config" "cluster-info" "odf_subnet" }}",
					"exclude": {{ fromConfigMap "openshift-config" "cluster-info" "odf_subnet_excluded_ips" }}
  	}
  }'