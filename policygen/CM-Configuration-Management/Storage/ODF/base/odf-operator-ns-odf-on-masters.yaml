apiVersion: v1
kind: Namespace
metadata:
  name: openshift-storage
  annotations:
    scheduler.alpha.kubernetes.io/defaultTolerations: '[{"operator": "Exists", "effect": "NoSchedule", "key": "node-role.kubernetes.io/master"},{"operator": "Equal", "effect": "NoSchedule", "key": "node.ocs.openshift.io/storage", "value": "true"}]'
  labels:
    openshift.io/cluster-monitoring: 'true'
