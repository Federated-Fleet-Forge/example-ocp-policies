# Hub lab (localsno sno2): second virtio disk as LVM VG + thin pool for TopoLVM CSI.
# Path from: ls /dev/disk/by-path on node (virtio-pci-0000:07:00.0 -> vdb). Re-check if PCI slot changes after disk reorder.
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: hub-lab-lvmcluster
  namespace: openshift-storage
spec:
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  storage:
    deviceClasses:
      - name: vg1-lvms
        fstype: xfs
        default: true
        deviceSelector:
          paths:
            - /dev/disk/by-path/virtio-pci-0000:07:00.0
          forceWipeDevicesAndDestroyAllData: true
        thinPoolConfig:
          name: thin-pool-1
          sizePercent: 90
          overprovisionRatio: 10
          chunkSize: 128Ki
          chunkSizeCalculationPolicy: Static
