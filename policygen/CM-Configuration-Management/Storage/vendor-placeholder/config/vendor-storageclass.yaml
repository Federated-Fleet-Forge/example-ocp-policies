apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vendor-csi-default
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: <VENDOR_CSI_PROVISIONER>
parameters:
  # Add vendor-specific parameters here, e.g.:
  # pool: default-pool
  # fsType: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
