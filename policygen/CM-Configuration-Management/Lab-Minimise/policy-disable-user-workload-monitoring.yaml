apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
      retention: 1h
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi
    thanosRuler:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
