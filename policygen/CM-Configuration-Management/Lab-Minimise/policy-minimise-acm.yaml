apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: multiclusterhub
  namespace: open-cluster-management
spec:
  overrides:
    components:
      - name: search
        enabled: false
      - name: console
        enabled: false
      - name: cluster-backup
        enabled: false
      - name: volsync
        enabled: false
