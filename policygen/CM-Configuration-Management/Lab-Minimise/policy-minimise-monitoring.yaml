apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: false
    alertmanagerMain:
      enabled: false
    telemeterClient:
      enabled: false
    prometheusK8s:
      retention: 2h
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 2Gi
    kubeStateMetrics:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
    thanosQuerier:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
