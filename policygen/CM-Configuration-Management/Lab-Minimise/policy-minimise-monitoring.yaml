# Platform Prometheus: omit prometheusK8s.volumeClaimTemplate so TSDB uses
# ephemeral storage. A volumeClaimTemplate with default StorageClass
# kubernetes.io/no-provisioner leaves prometheus-k8s-0 Pending (no PV bind).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: false
    alertmanagerMain:
      enabled: false
    telemeterClient:
      enabled: false
    prometheusK8s:
      retention: 2h
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
    kubeStateMetrics:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
    thanosQuerier:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
