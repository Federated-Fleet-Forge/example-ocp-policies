# BMC credentials copied into spoke namespaces by policy-hub-secrets-ztp (bmh-secret.yaml).
# Default sushy-tools (sushy-lab) has no HTTP Basic Auth; empty values work for many builds.
# If you enable Redfish auth on Sushy, replace via policy patch or oc -n policies edit secret bmh-secret.
---
apiVersion: v1
kind: Secret
metadata:
  name: bmh-secret
  namespace: policies
type: Opaque
stringData:
  username: ""
  password: ""
