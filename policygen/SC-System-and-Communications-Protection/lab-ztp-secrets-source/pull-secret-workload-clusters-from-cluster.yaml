# Same content as cluster pull-secret; many labs use one pull config for hub and workload spokes.
---
apiVersion: v1
kind: Secret
metadata:
  name: pull-secret-workload-clusters
  namespace: policies
type: Opaque
data:
  .dockerconfigjson: '{{ (fromSecret "openshift-config" "pull-secret" ".dockerconfigjson") }}'
